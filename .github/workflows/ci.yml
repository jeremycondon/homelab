name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          severity: warning

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    env:
      DOMAIN: example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stub missing secret env files
        # one empty stub per *.env.example, so new secrets don't break CI
        run: for f in secrets/*.env.example; do touch "${f%.example}"; done

      - name: Validate compose syntax
        run: docker compose config --quiet

  secrets-guard:
    name: No plaintext secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for unencrypted secret files
        run: |
          # Catch any *.env or *.yml in secrets/ that isn't an .example or .enc file.
          # gitignore normally blocks these, but this acts as a CI safety net.
          leaked=$(git ls-files secrets/ | grep -E '\.(env|yml)$' | grep -vE '\.(example|enc)$' || true)
          if [ -n "$leaked" ]; then
            echo "ERROR: Plaintext secret files must not be committed:"
            echo "$leaked"
            echo "Run 'make encrypt-secrets' and commit the .enc files instead."
            exit 1
          fi
          echo "No plaintext secrets found."

      - name: Scan git history for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Required for private repos
