# json_exporter modules for PiAware (dump1090-fa) on the Pi Zero 2 W.
# Prometheus probes json-exporter, which fetches SkyAware's JSON from the Pi:
#   http://piaware.local/skyaware/data/{stats,aircraft,receiver}.json
# Field reference: dump1090-fa net_io.c (appendStatsJson / generateAircraftJson).
# Dashboard: grafana/dashboards/piaware.json (generated by gen.py)
modules:
  # stats.json: `total` is since dump1090-fa started (counters; rate() copes with restarts),
  # `last1min` is the latest complete minute (gauges).
  piaware_stats:
    metrics:
      - {name: piaware_messages_total, path: '{.total.messages}', valuetype: counter,
         help: "Mode S messages decoded (local + network)"}
      - {name: piaware_modes_preambles_total, path: '{.total.local.modes}', valuetype: counter,
         help: "Mode S preambles seen by the demodulator"}
      - {name: piaware_accepted_total, path: '{.total.local.accepted[0]}', valuetype: counter,
         help: "Messages accepted with no CRC error correction"}
      - {name: piaware_strong_signals_total, path: '{.total.local.strong_signals}', valuetype: counter,
         help: "Messages above -3 dBFS (too much gain if this is high)"}
      - {name: piaware_samples_dropped_total, path: '{.total.local.samples_dropped}', valuetype: counter,
         help: "SDR samples dropped (Pi too slow or USB trouble)"}
      - {name: piaware_tracks_total, path: '{.total.tracks.all}', valuetype: counter,
         help: "Aircraft tracks created"}
      - {name: piaware_tracks_single_message_total, path: '{.total.tracks.single_message}', valuetype: counter,
         help: "Tracks that only ever got one message (noise)"}
      - {name: piaware_cpr_global_ok_total, path: '{.total.cpr.global_ok}', valuetype: counter,
         help: "Positions decoded"}
      - {name: piaware_cpu_demod_milliseconds_total, path: '{.total.cpu.demod}', valuetype: counter,
         help: "CPU time in the demodulator"}
      - {name: piaware_cpu_reader_milliseconds_total, path: '{.total.cpu.reader}', valuetype: counter,
         help: "CPU time reading from the SDR"}
      - {name: piaware_cpu_background_milliseconds_total, path: '{.total.cpu.background}', valuetype: counter,
         help: "CPU time in background tasks (network, JSON)"}
      - {name: piaware_signal_dbfs, path: '{.last1min.local.signal}',
         help: "Mean signal level, last minute"}
      - {name: piaware_noise_dbfs, path: '{.last1min.local.noise}',
         help: "Noise floor, last minute"}
      - {name: piaware_peak_signal_dbfs, path: '{.last1min.local.peak_signal}',
         help: "Strongest signal, last minute"}
      - {name: piaware_gain_db, path: '{.last1min.local.gain_db}',
         help: "SDR gain (changes when adaptive gain is on)"}

  # aircraft.json: one series per aircraft (label hex), so the dashboard can count them and work out range.
  # Aircraft drop out of the file ~5 min after they were last heard; their series go stale with them.
  # Position fields are a separate metric filtered to aircraft that have one, otherwise
  # json_exporter logs an error for every position-less aircraft on every scrape.
  piaware_aircraft:
    metrics:
      - name: piaware_aircraft
        type: object
        path: '{.aircraft[*]}'
        help: "Per-aircraft values from aircraft.json"
        labels:
          hex: '{.hex}'
        values:
          seen_seconds: '{.seen}'
          rssi_dbfs: '{.rssi}'
      - name: piaware_aircraft_position
        type: object
        path: '{.aircraft[?(@.lat)]}'
        help: "Last position of aircraft that have one"
        labels:
          hex: '{.hex}'
        values:
          lat: '{.lat}'
          lon: '{.lon}'
          seen_seconds: '{.seen_pos}'

  # receiver.json: the site location set on flightaware.com (needed for range)
  piaware_receiver:
    metrics:
      - {name: piaware_receiver_lat, path: '{.lat}', help: "Receiver latitude"}
      - {name: piaware_receiver_lon, path: '{.lon}', help: "Receiver longitude"}
