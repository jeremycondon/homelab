networks:
  homelab:
    name: homelab

volumes:
  portainer_data:
  prometheus_data:
  traefik_certs:
  photoprism_db:
  uptime_kuma_data:

services:

  # ── Reverse proxy ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./services/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certs:/certs
    env_file:
      - secrets/traefik.env        # Route53 creds for the Let's Encrypt DNS challenge
    # pin public DNS: inheriting the host's (Tailscale MagicDNS) left ACME unable to resolve anything
    dns:
      - 1.1.1.1
      - 8.8.8.8
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=homelab"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      # requests the wildcard cert; all other routers (tls=true) are served from it by SNI
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.tls.domains[0].main=${DOMAIN}"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.${DOMAIN}"
      - "traefik.http.routers.dashboard.service=api@internal"

  # ── UI ─────────────────────────────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  # ── Media ──────────────────────────────────────────────────────────────────
  # Plex replaced Jellyfin (Oct 2026). Old Jellyfin config is still in /data/jellyfin.
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    # host networking: Plex LAN discovery (GDM) and DLNA need it
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Detroit
      - VERSION=docker
      # Optional, only if the server doesn't show up for setup on the LAN:
      # get a 4-minute token from https://plex.tv/claim and set PLEX_CLAIM=claim-xxxx once
    devices:
      - /dev/dri:/dev/dri          # Intel N100 iGPU for hardware transcoding (Plex Pass)
    group_add:
      - "992"                      # render
      - "44"                       # video
    volumes:
      - /data/plex/config:/config
      - /data/plex/transcode:/transcode
      # media is read-only except music: Plex may delete music ("Allow media deletion")
      - /tank/media/movies:/media/movies:ro
      - /tank/media/tv:/media/tv:ro
      - /tank/media/music:/media/music
      - /tank/media/audiobooks:/media/audiobooks:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOMAIN}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
      # host networking: Traefik can't discover the container IP, so we point it at the host
      - "traefik.http.services.plex.loadbalancer.server.url=http://host-gateway:32400"

  # ── Monitoring ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - homelab

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    # run as the owner of /data/grafana (default uid 472 can't write there -> restart loop)
    user: "1000:1000"
    volumes:
      - /data/grafana:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    env_file:
      - secrets/grafana.env
    networks:
      - homelab
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ── Uptime monitoring ──────────────────────────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - homelab
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime-kuma.rule=Host(`uptime.${DOMAIN}`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

  # ── Photos ─────────────────────────────────────────────────────────────────
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    env_file:
      - secrets/photoprism.env
    environment:
      - TZ=America/Detroit
      - PHOTOPRISM_ORIGINALS_PATH=/photoprism/originals
      - PHOTOPRISM_STORAGE_PATH=/photoprism/storage
      - PHOTOPRISM_DATABASE_DRIVER=mysql
      - PHOTOPRISM_DATABASE_SERVER=photoprism_db:3306
      - PHOTOPRISM_DATABASE_NAME=photoprism
      - PHOTOPRISM_DATABASE_USER=photoprism
      # PHOTOPRISM_DATABASE_PASSWORD comes from env_file
      - PHOTOPRISM_SITE_URL=https://photos.${DOMAIN}/
      - PHOTOPRISM_DISABLE_TLS=true
      # run as jeremy so anything written into /tank/photos is owned by jeremy, not root
      - PHOTOPRISM_UID=1000
      - PHOTOPRISM_GID=1000
      # 3.3 GB RAM host: one indexing worker (AI/TensorFlow stays enabled)
      - PHOTOPRISM_WORKERS=1
    volumes:
      - /tank/photos:/photoprism/originals
      - /data/photoprism/storage:/photoprism/storage
    networks:
      - homelab
    depends_on:
      - photoprism_db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.photoprism.rule=Host(`photos.${DOMAIN}`)"
      - "traefik.http.routers.photoprism.entrypoints=websecure"
      - "traefik.http.routers.photoprism.tls=true"
      # TODO: uncomment when Let's Encrypt is configured
      # - "traefik.http.routers.photoprism.tls.certresolver=letsencrypt"
      - "traefik.http.services.photoprism.loadbalancer.server.port=2342"

  photoprism_db:
    image: mariadb:11
    container_name: photoprism_db
    restart: unless-stopped
    env_file:
      - secrets/photoprism.env
    volumes:
      - photoprism_db:/var/lib/mysql
    networks:
      - homelab
    command:
      - --innodb-buffer-pool-size=256M
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  # ── Home automation ────────────────────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    # host networking: device discovery (mDNS/SSDP) and the HomeKit Bridge integration need it
    network_mode: host
    # Bluetooth adapter management/recovery
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=America/Detroit
    volumes:
      - /data/homeassistant/config:/config
      - ./services/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - /run/dbus:/run/dbus:ro     # Bluetooth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.tls=true"
      # host networking: Traefik can't discover the container IP, so we point it at the host
      - "traefik.http.services.homeassistant.loadbalancer.server.url=http://host-gateway:8123"

  # ── File sharing ───────────────────────────────────────────────────────────
  samba:
    image: crazymax/samba:latest
    container_name: samba
    restart: unless-stopped
    # host networking required for SMB broadcast and reliable LAN discovery
    network_mode: host
    volumes:
      - ./secrets/samba-config.yml:/data/config.yml:ro
      - /tank/documents:/files                    # "files" share = documents
      - /tank/backups/timemachine:/timemachine    # tank/backups/timemachine dataset (2T quota)
      - /home/jeremy/Documents:/documents         # "documents" share = ~/Documents on the NVMe (not backed up)
      # Whole /tank (reorganized datasets + old *.migrated until cleanup)
      - /tank:/tank
    environment:
      - TZ=America/Detroit
      - SAMBA_LOG_LEVEL=0
